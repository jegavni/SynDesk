server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://syndesk-server-latest.onrender.com/api/;
        proxy_set_header Host syndesk-server-latest.onrender.com;
        proxy_ssl_server_name on;
    }

    location /socket.io/ {
        proxy_pass https://syndesk-server-latest.onrender.com/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host syndesk-server-latest.onrender.com;
        proxy_ssl_server_name on;
    }

    location /assets/ {
        try_files $uri =404;
    }
}